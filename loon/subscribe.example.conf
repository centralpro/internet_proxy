# Loon 订阅示例 — 将片段合并进主配置
# 1. 将 <你的仓库 raw 地址> 换成 GitHub/Gitee 上的 list 直链
# 2. 将 Proxy 换成你的策略名（如 香港、节点选择、PROXY 等）
# 3. [Rule] 中 RULE-SET 顺序越靠前优先级越高，建议放在国内直连规则之后

[Remote Rule]
DEV = https://raw.githubusercontent.com/<user>/internat_proxy/main/dev/dev.list,auto-update=true,interval=86400
AI = https://raw.githubusercontent.com/<user>/internat_proxy/main/AI/aiProxy.list,auto-update=true,interval=86400
CURSOR = https://raw.githubusercontent.com/<user>/internat_proxy/main/cursor/cursorPoxy.list,auto-update=true,interval=86400
CHINA = https://raw.githubusercontent.com/<user>/internat_proxy/main/common/china-common.list,auto-update=true,interval=86400

[Rule]
# 规则自上而下匹配：先匹配规则集，再 GEOIP，最后 FINAL
RULE-SET,DEV,Proxy
RULE-SET,AI,Proxy
RULE-SET,CURSOR,Proxy
RULE-SET,CHINA,Proxy
GEOIP,CN,DIRECT
FINAL,DIRECT
